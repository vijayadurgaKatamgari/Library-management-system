<main><div class="page-head"><div><h1>💳 Payments</h1><p>Record fines and update payment methods.</p></div></div>

<div class="panel"><h2>Payment Ledger</h2><div id="paymentsTable"></div></div></main><script src="js/app.js"></script><script>loadPayments();</script></body></html>
